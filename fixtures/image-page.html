<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image page</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #fff; font-family: sans-serif; }
  h1 { margin: 0; padding: 12px 16px; font-size: 20px; height: 28px; }
  /* A tall scrolling box: Chrome scrolls it on the compositor thread. */
  #scroller { height: 300px; overflow: auto; margin: 0 16px; border: 1px solid #ccc; }
  .card { display: block; width: 320px; height: 120px; margin-left: 24px; }
  .gap { height: 80px; }
  .tall { height: 900px; }
  #flow-intro { margin: 16px; height: 20px; }
  #after { height: 1500px; }
</style>
</head>
<body>
<!-- Two images of an (invented) SSN card: the number is pixels, not DOM text.
     One sits inside a scrolling box, the other in the document flow. -->
<h1>Uploaded documents</h1>
<div id="scroller">
  <div class="gap"></div>
  <img id="card-scroll" class="card" src="ssn-card.svg" alt="">
  <div class="tall"></div>
</div>
<p id="flow-intro">Scanned copy</p>
<img id="card-flow" class="card" src="ssn-card.svg" alt="">
<div id="after"></div>
</body>
</html>
