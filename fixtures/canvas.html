<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas document</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #fff; font-family: sans-serif; }
  #caption { margin: 0; padding: 8px 16px; height: 24px; font-size: 14px; color: #444; }
  #page { position: relative; }
  #doc-canvas { display: block; width: 100%; height: 600px; }
</style>
</head>
<body>
<!-- A canvas-drawn "document", the way Google Docs renders: the text below is
     pixels only, there is no DOM text for it. The caption is the only DOM text. -->
<p id="caption">Quarterly notes (drawn on canvas)</p>
<div id="page"><canvas id="doc-canvas"></canvas></div>
<script>
  const canvas = document.getElementById('doc-canvas');
  // Drawn text box, in viewport CSS pixels, for the tests (page world).
  window.ssnBox = null;
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 28px sans-serif';
    ctx.textBaseline = 'top';
    // Like a document page: the left margin scales with the width.
    const x = Math.round(w * 0.05);
    const y = 100;
    const text = 'SSN 123-45-6789';
    ctx.fillText(text, x, y);
    const tw = ctx.measureText(text).width;
    const r = canvas.getBoundingClientRect();
    window.ssnBox = { x: r.left + x, y: r.top + y, w: tw, h: 28 };
    ctx.fillText('Lorem ipsum dolor sit amet, consectetur adipiscing elit.', x, y + 60);
  }
  draw();
  window.addEventListener('resize', draw);
</script>
</body>
</html>
