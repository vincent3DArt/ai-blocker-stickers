name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm scan
      - run: pnpm build
      - run: pnpm check:prod

  e2e:
    runs-on: windows-latest
    # The e2e suite drives a real Microsoft Edge instance with the extension
    # loaded. Shared runners are slow and noisy, so timing-sensitive steps can
    # fail for reasons unrelated to the code. Failures are reported but do not
    # block the build. Run `pnpm e2e` locally before merging.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
